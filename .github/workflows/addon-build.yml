name: Validate and package addon

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Lua 5.1 and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zip unzip
      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find MerchantsFavourOptimiser -type f -name '*.lua' -print0 |
            while IFS= read -r -d '' file; do
              echo "Checking $file"
              luac5.1 -p "$file"
            done
      - name: Run crate data and calculation regression tests
        run: lua5.1 tests/mfo-regression.lua
      - name: Validate addon structure, manifest version and referenced assets
        shell: bash
        run: |
          set -euo pipefail
          addon="MerchantsFavourOptimiser"
          toc="$addon/MerchantsFavourOptimiser.toc"
          test -f "$toc"
          test -f "$addon/Core.lua"
          test -f "$addon/Data.lua"
          grep -q '^## Interface:' "$toc"
          versions="$(grep -c '^## Version:' "$toc" || true)"
          test "$versions" -eq 1
          version="$(sed -n 's/^## Version:[[:space:]]*//p' "$toc")"
          test -n "$version"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Manifest version must use MAJOR.MINOR.PATCH, got '$version'"
            exit 1
          fi
          while IFS= read -r entry; do
            case "$entry" in ""|\#*) continue ;; esac
            if [[ ! -f "$addon/$entry" ]]; then
              echo "::error::Manifest references missing file: $entry"
              exit 1
            fi
          done < "$toc"
          echo "Addon version: $version; manifest file entries validated."
          # Verify texture references in Lua point to files included beside the TOC.
          python3 - "$addon" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          text = "\n".join(p.read_text(errors="ignore") for p in root.glob("*.lua"))
          # Textures are referenced by concatenating MFO_ART with a stem.
          stems = set(re.findall(r'MFO_ART\s*\.\.\s*["\']([^"\']+)["\']', text))
          missing = [stem for stem in sorted(stems)
                     if not any((root / (stem + ext)).is_file()
                                for ext in (".tga", ".blp", ".png"))]
          if missing:
              print("Missing texture assets: " + ", ".join(missing))
              sys.exit(1)
          # Prevent unused artwork from silently accumulating in the addon ZIP.
          assets = {p.stem for p in root.iterdir()
                    if p.is_file() and p.suffix.lower() in (".tga", ".blp", ".png")}
          unused = sorted(assets - stems)
          if unused:
              print("Unused texture assets: " + ", ".join(unused))
              sys.exit(1)
          print(f"Texture references validated ({len(stems)} unique assets; none unused).")
          PY
      - name: Package addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          addon="MerchantsFavourOptimiser"
          version="$(sed -n 's/^## Version:[[:space:]]*//p' "$addon/MerchantsFavourOptimiser.toc" | head -n1)"
          mkdir -p dist
          zip -q -r "dist/MerchantsFavourOptimiser_v${version}_Forever.zip" "$addon" \
            -x '*/.DS_Store' '*/Thumbs.db'
          archive="dist/MerchantsFavourOptimiser_v${version}_Forever.zip"
          unzip -t "$archive"
          python3 - "$archive" "$version" <<'PY'
          import pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          expected_version = sys.argv[2]
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("Duplicate paths found in addon ZIP")
              files = [n for n in names if not n.endswith("/")]
              if not files or any(not n.startswith("MerchantsFavourOptimiser/") for n in files):
                  raise SystemExit("ZIP must contain files under exactly one canonical addon folder")
              required = {
                  "MerchantsFavourOptimiser/MerchantsFavourOptimiser.toc",
                  "MerchantsFavourOptimiser/Data.lua",
                  "MerchantsFavourOptimiser/Calculations.lua",
                  "MerchantsFavourOptimiser/Core.lua",
              }
              missing = sorted(required - set(files))
              if missing:
                  raise SystemExit("Missing required ZIP files: " + ", ".join(missing))
              toc = zf.read("MerchantsFavourOptimiser/MerchantsFavourOptimiser.toc").decode("utf-8")
              versions = [line.split(":", 1)[1].strip() for line in toc.splitlines()
                          if line.startswith("## Version:")]
              if versions != [expected_version]:
                  raise SystemExit(f"ZIP version mismatch: expected {expected_version}, found {versions}")
          print(f"ZIP layout, duplicate paths, required files and version {expected_version} validated.")
          PY
          echo "PACKAGE=$archive" >> "$GITHUB_ENV"
      - name: Upload testable ZIP
        uses: actions/upload-artifact@v5
        with:
          name: Merchant-Favour-Optimiser-${{ github.sha }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
          retention-days: 30
