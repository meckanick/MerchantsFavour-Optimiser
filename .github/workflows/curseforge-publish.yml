name: Publish MFO to CurseForge

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact addon version to publish (e.g. 0.1.71)'
        required: true
        type: string
      changelog:
        description: 'Release notes for this update'
        required: true
        type: string
      release_type:
        description: 'CurseForge release channel'
        required: true
        default: release
        type: choice
        options: [release, beta, alpha]
      dry_run:
        description: 'Validate and preview without uploading'
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: curseforge-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Find validated package for this exact main commit
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'addon-build.yml', branch: 'main',
              head_sha: context.sha, status: 'success', event: 'push', per_page: 100
            });
            const run = runs.data.workflow_runs.find(r => r.head_sha === context.sha);
            if (!run) throw new Error('Wait for the main build and validation workflow to pass.');
            core.setOutput('run_id', String(run.id));
      - name: Download validated ZIP
        uses: actions/download-artifact@v4
        with:
          name: Merchant-Favour-Optimiser-${{ github.sha }}
          path: publish-package
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
      - name: Preview or publish
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSION_IDS: ${{ vars.CF_GAME_VERSION_IDS }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANGELOG: ${{ inputs.changelog }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/publish-curseforge.py
